# Dependencies and tool configuration for this project.
#
# Orchestration -- *which* commands run -- lives in the makefile. This file
# holds the *settings* those tools use, so that editors, pre-commit hooks, and
# CI all pick up the same configuration as `make lint` / `make test`.
#
# No plugins are required: ruff, mypy, and coverage all read their
# configuration from pyproject.toml natively.

# Dependencies, as a PEP 735 dependency group. `make .venv` installs this
# group, so edit the list here to add or remove libraries.
#
# Versions are pinned with `==` so that every machine and the Docker image
# build identical environments. Bump a pin deliberately; `make .venv` will
# reinstall on the next `make` command.
#
# Requires pip 25.1 or newer for `pip install --group`. No [project] table is
# needed: this template builds a binary with pyinstaller rather than
# publishing a package. If you do start distributing this on an index, add a
# [project] table and put *runtime* dependencies in its `dependencies` key,
# leaving the development-only tools below.

[dependency-groups]
dev = [
    "coverage==7.16.0",
    "mypy==2.3.1",
    "pyinstaller==6.22.2",
    "ruff==0.16.5",
]

[tool.mypy]
strict = true
# Assume this Python version when type checking, rather than whatever
# interpreter happens to be running mypy. Keep in sync with the Dockerfile.
python_version = "3.14"

[tool.ruff]
# Syntax and idioms to target. Keep in sync with the Dockerfile.
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# Rule families to enable. Expand this list to opt into more checks.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import sorting)
    "B",        # flake8-bugbear (likely-bug patterns)
    "UP",       # pyupgrade (modernize syntax)
    "PL",       # pylint-equivalent rules
    "RUF",      # Ruff-specific rules
    "SIM",      # flake8-simplify (redundant constructs)
    "C4",       # flake8-comprehensions
    "N",        # pep8-naming
    "PIE",      # flake8-pie (misc. lint)
    "G",        # flake8-logging-format (lazy %-formatting in log calls)
]

# Individual rules to switch back off. These come from the families above
# but are noisy or enforce arbitrary thresholds.
ignore = [
    "PLR2004",  # magic-value-comparison: noisy, especially in tests
    "PLR0913",  # too-many-arguments: arbitrary threshold
    "PLC0415",  # import-outside-top-level: forbids lazy imports
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Excluded in addition to the built-in defaults (which already cover
# "# pragma: no cover"). This lets you drop the pragma from __main__ guards.
exclude_also = [
    "if __name__ == .__main__.:",
]
# Fail the build if coverage regresses below this percentage.
fail_under = 80
